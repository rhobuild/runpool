version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-dependencies:
        # The provider SDK arrives on its own. It is the one dependency
        # whose behaviour no pull request can check — the contracts that
        # exercise it reach protected fixtures, so they never run on one —
        # and an update folded into a batch of a dozen is one nobody
        # dispatches those contracts for.
        exclude-patterns: ["github.com/actions/scaleset"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /build/controller
    schedule:
      interval: weekly
      day: monday
    groups:
      controller-images:
        patterns: ["*"]
    ignore:
      # Same builder, same reason as the capsule below.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /build/capsule
    schedule:
      interval: weekly
      day: monday
    groups:
      capsule-images:
        patterns: ["*"]
    ignore:
      # The builder must compile with the Go that go.mod declares and that
      # every test ran on. Patch releases keep that true and are welcome;
      # a minor or major bump does not, and it is also where Go publishes
      # release candidates, so an unattended update once proposed building
      # the shipped binary with a compiler no test had used. Those bumps
      # belong in the same reviewed commit as go.mod.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
