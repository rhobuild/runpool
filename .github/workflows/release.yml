name: release

on:
  push:
    tags: ["v*"]
  # The candidate chain, run against a throwaway tag. It is the only way
  # to exercise a multi-platform build and the index it assembles before
  # a real tag depends on them: the qualification and the publication
  # below do not run for it.
  workflow_dispatch:

defaults:
  run:
    # GitHub's default shell omits pipefail, so a step that pipes into tee
    # reports tee's exit status and a failing suite reads as a pass.
    shell: bash

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The exact toolchain, held equal to go.mod by the consistency
  # suite. This workflow compiles the binary that
  # ships, so a compiler chosen here and nowhere else would be the one
  # thing no gate ever exercised.
  GOTOOLCHAIN: go1.26.7

jobs:
  version:
    name: the version this run is for
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.this.outputs.version }}
      candidate: ${{ steps.this.outputs.candidate }}
    steps:
      - name: State the version and the candidate tag
        # A tag push releases itself; a dispatch is a rehearsal, and the
        # version it stamps has to be a publishable SemVer string so the
        # same checks run, while naming itself so nothing mistakes the
        # images it leaves for a candidate.
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        id: this
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "candidate=candidate-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dry-run" >> "$GITHUB_OUTPUT"
            echo "candidate=dry-run-${SHA}" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: validate release tag
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      # The section this step read, split where the release page wants
      # it: the entry's opening summary, and the grouped detail under
      # it. Carried from here rather than read again in the publishing
      # job, so the bytes published are the bytes the gate accepted --
      # a second read could take a section from a heading nobody
      # checked against the tag.
      lead: ${{ steps.changelog.outputs.lead }}
      detail: ${{ steps.changelog.outputs.detail }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Verify the version stamped into the artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go build -trimpath -ldflags "-X main.version=${VERSION}" -o /tmp/runpool-version ./cmd/runpool
          /tmp/runpool-version version --check-release

      - name: Verify the changelog names this release
        id: changelog
        # Only a tag push releases. A dispatch stamps v0.0.0-dry-run,
        # which no changelog section names and none should.
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DELIM: RUNPOOL_CHANGELOG_SECTION
        run: |
          # The version exists only on the tag, so this is the only gate
          # that can ask this. The step above asks the binary about its
          # own stamp and cannot read the tree; the consistency suite
          # reads the tree and never sees a tag. Between the two, a
          # release whose newest section still reads "Unreleased"
          # publishes, at its own tag, a document denying the release
          # a reader reached it from.
          # || true, because the job's shell carries -e: a changelog with
          # no section heading at all makes grep exit 1, which kills the
          # step before the diagnostic below runs and leaves the operator
          # a bare "exit code 1" that reads as a broken script rather
          # than a broken changelog. Empty falls through to the case.
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          case "$heading" in
            "## ${VERSION}"|"## ${VERSION} "*) ;;
            *)
              echo "CHANGELOG.md opens with \"${heading}\"; this release is ${VERSION}" >&2
              exit 1
              ;;
          esac
          echo "the changelog names ${VERSION}"

          # The same heading, not the version matched a second time:
          # $heading is the line the case above accepted, so what is
          # published is what was checked. Print between it and the next
          # heading -- the whole entry, and nothing from the release
          # before it.
          section=$(awk -v h="$heading" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md)

          # A changelog is read inside the repository, where a link to
          # docs/runbook.md resolves. A release page is not there. Pin
          # every relative link to this tag, so a version's page reaches
          # the documentation as it stood for that version rather than
          # as it stands today.
          section=$(printf '%s\n' "$section" | sed -E \
            "s#\]\((docs|build|deploy|scripts|test|internal|cmd|\.github)/#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${VERSION}/\1/#g")

          # Anything still relative is a path this step does not know how
          # to pin, and a broken link on the page a version is read from.
          # Failing here costs a maintainer one line; not failing costs
          # every reader of that release.
          stray=$(printf '%s\n' "$section" | grep -oE '\]\([^)]*\)' | grep -vE '\]\((https?://|#)' || true)
          if [ -n "$stray" ]; then
            echo "the changelog entry links to ${stray}, which a release page cannot resolve" >&2
            exit 1
          fi

          # Every entry opens with a paragraph saying what the release
          # is, then groups the detail under `###` headings. They go to
          # different places on the release page: the summary above the
          # deployment instructions a reader came for, the groups below
          # them. An entry with no groups is all summary, which is what
          # a release with one kind of change looks like.
          lead=$(printf '%s\n' "$section" | awk '/^### / { exit } { print }')
          detail=$(printf '%s\n' "$section" | awk '/^### / { on = 1 } on { print }')
          # The heading travels with the groups rather than sitting in
          # the body template, so an entry that has none contributes an
          # empty string instead of a heading with nothing under it.
          if [ -n "$(printf '%s' "$detail" | tr -d '[:space:]')" ]; then
            detail=$(printf '## What changed\n\n%s\n' "$detail")
          fi

          emit() {
            # Blank lines at either end only. A body opening on an empty
            # line renders as one on the release page.
            value=$(printf '%s\n' "$2" | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
            # A delimiter occurring in the value would end it early and
            # leave the remainder parsed as further outputs.
            if printf '%s\n' "$value" | grep -qx "$DELIM"; then
              echo "the changelog section contains the delimiter this step writes with" >&2
              exit 1
            fi
            {
              echo "$1<<$DELIM"
              printf '%s\n' "$value"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -z "$(printf '%s' "$lead" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md heading \"${heading}\" has no summary under it" >&2
            exit 1
          fi
          emit lead "$lead"
          emit detail "$detail"
          echo "the release page carries $(printf '%s\n' "$section" | wc -l) lines of changelog"

  # One platform per runner, natively. Every base image these build from
  # is pinned to an index digest that publishes both, so an arm64 runner
  # resolves the arm64 child of the reviewed digest and nothing is
  # emulated: the capsule's final stage installs packages, which under
  # emulation is slow and occasionally wrong, and a binary verified by
  # running it has to run on the architecture it is for.
  capsule:
    name: capsule candidate
    needs: [validate, version]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    # The first job that writes to a registry, before anything has been
    # qualified. The protected tag is what authorizes the run; the
    # environment is where that authorization is recorded and can be held
    # for review, the same place the publication gate already lives.
    environment: release-candidate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push this platform's capsule
        env:
          NAME: ghcr.io/${{ github.repository }}/capsule
          PLATFORM: ${{ matrix.platform }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
        run: |
          arch=${PLATFORM#*/}
          scripts/ci/retry.sh docker build -f build/capsule/Dockerfile -t "${NAME}:${CANDIDATE}-${arch}" .
          scripts/ci/retry.sh docker push "${NAME}:${CANDIDATE}-${arch}"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' \
            "${NAME}:${CANDIDATE}-${arch}")
          case "$reference" in
            *@sha256:*) ;;
            *) echo "registry returned no immutable capsule digest"; exit 1 ;;
          esac
          # The digest travels as a file rather than a job output: a
          # matrix leg's outputs overwrite its siblings', and which of
          # them survived would decide what the index holds.
          mkdir -p digests
          printf '%s' "${reference#*@}" > "digests/${arch}"

      - name: Keep this platform's digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsule-digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  capsule-index:
    name: capsule index
    needs: [capsule, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-candidate
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.index.outputs.reference }}
    steps:
      # This job assembles an index out of digests other jobs pushed, so
      # it wants nothing from the tree -- except that the command it
      # assembles them with now runs through a helper that lives in it.
      #
      # Before the download below, and that ordering is load-bearing:
      # checkout cleans the workspace, so the same step placed after it
      # would delete the digests this job exists to read and leave the
      # assembly with nothing, which is not what the failure would say.
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capsule-digest-*
          merge-multiple: true
          path: digests

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble the capsule index
        id: index
        env:
          NAME: ghcr.io/${{ github.repository }}/capsule
          CANDIDATE: ${{ needs.version.outputs.candidate }}
        run: |
          set --
          for file in digests/*; do
            set -- "$@" "${NAME}@$(cat "$file")"
          done
          [ "$#" -gt 0 ] || { echo "no platform digest to index"; exit 1; }
          # A manifest list assembled from the bytes each runner pushed.
          # The controller embeds this one reference: the daemon resolves
          # the matching child at pull time, so one exact digest is
          # correct for every architecture.
          scripts/ci/retry.sh docker buildx imagetools create --tag "${NAME}:${CANDIDATE}" "$@"
          digest=$(scripts/ci/retry.sh docker buildx imagetools inspect "${NAME}:${CANDIDATE}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "the registry returned no index digest"; exit 1 ;;
          esac
          # The index has to hold every platform that was pushed into it.
          # The digest files are named for the architecture each runner
          # built, so the set that was assembled is compared with the set
          # the registry now serves rather than with a list written here:
          # a leg that failed to upload, or a create that silently took
          # fewer arguments, is an index missing a platform nobody asked
          # about again until an operator pulls one.
          built=$(basename -a digests/* | sort | tr '\n' ' ')
          # One line, so no indentation of this file leaks into the
          # template's own output. Attestation manifests carry no real
          # architecture and are skipped rather than counted as a
          # platform nobody asked for.
          template='{{range .Manifest.Manifests}}{{if .Platform}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.Architecture}} {{end}}{{end}}{{end}}'
          published=$(scripts/ci/retry.sh docker buildx imagetools inspect "${NAME}@${digest}" --format "$template" \
            | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ')
          if [ "$built" != "$published" ]; then
            echo "the index serves [$published]; this run built [$built]"
            exit 1
          fi
          echo "reference=${NAME}@${digest}" >> "$GITHUB_OUTPUT"

  controller:
    name: controller candidate
    needs: [capsule-index, version]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    environment: release-candidate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push this platform's controller
        env:
          CAPSULE_IMAGE: ${{ needs.capsule-index.outputs.reference }}
          NAME: ghcr.io/${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          arch=${PLATFORM#*/}
          scripts/ci/retry.sh docker build -f build/controller/Dockerfile \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "CAPSULE_IMAGE=${CAPSULE_IMAGE}" \
            -t "${NAME}:${CANDIDATE}-${arch}" .
          scripts/ci/retry.sh docker push "${NAME}:${CANDIDATE}-${arch}"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' \
            "${NAME}:${CANDIDATE}-${arch}")
          case "$reference" in
            *@sha256:*) ;;
            *) echo "registry returned no immutable controller digest"; exit 1 ;;
          esac
          mkdir -p digests
          printf '%s' "${reference#*@}" > "digests/${arch}"

      - name: Keep this platform's digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  artifacts:
    name: standalone candidates
    needs: [capsule-index, version]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Build this platform's standalone binary
        # Built and then run on the architecture it is for. A binary
        # whose own report is only ever read on another architecture is
        # a binary nothing has executed.
        env:
          CAPSULE_IMAGE: ${{ needs.capsule-index.outputs.reference }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          arch=${PLATFORM#*/}
          mkdir -p release-artifacts
          GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.capsuleImage=${CAPSULE_IMAGE}" \
            -o "release-artifacts/runpool-linux-${arch}" ./cmd/runpool
          "release-artifacts/runpool-linux-${arch}" version --check-release
          facts=$("release-artifacts/runpool-linux-${arch}" version --json)
          echo "$facts"
          # What the linker stamped, read back out of the binary that
          # will ship. A -X that silently did nothing leaves the default
          # capsule reference, which is a mutable tag: the release would
          # carry a controller that resolves its capsule at run time
          # instead of running the one that was qualified.
          for stamped in "$VERSION" "$CAPSULE_IMAGE"; do
            case "$facts" in
              *"$stamped"*) ;;
              *) echo "the ${arch} binary does not report ${stamped}"; exit 1 ;;
            esac
          done
          (cd release-artifacts && sha256sum "runpool-linux-${arch}" > "checksums-${arch}.txt")

      - name: Keep this platform's standalone candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ strategy.job-index }}
          path: release-artifacts/*
          retention-days: 1
          if-no-files-found: error

  candidate:
    name: build immutable candidates
    needs: [capsule-index, controller, artifacts, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-candidate
    permissions:
      contents: read
      packages: write
    outputs:
      capsule_image: ${{ needs.capsule-index.outputs.reference }}
      controller_image: ${{ steps.index.outputs.reference }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Download the per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-digest-*
          merge-multiple: true
          path: digests

      - name: Download the per-platform standalone candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          merge-multiple: true
          path: release-artifacts

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble the controller index
        id: index
        env:
          NAME: ghcr.io/${{ github.repository }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
        run: |
          set --
          for file in digests/*; do
            set -- "$@" "${NAME}@$(cat "$file")"
          done
          [ "$#" -gt 0 ] || { echo "no platform digest to index"; exit 1; }
          scripts/ci/retry.sh docker buildx imagetools create --tag "${NAME}:${CANDIDATE}" "$@"
          digest=$(scripts/ci/retry.sh docker buildx imagetools inspect "${NAME}:${CANDIDATE}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "the registry returned no index digest"; exit 1 ;;
          esac
          # The index has to hold every platform that was pushed into it.
          # The digest files are named for the architecture each runner
          # built, so the set that was assembled is compared with the set
          # the registry now serves rather than with a list written here:
          # a leg that failed to upload, or a create that silently took
          # fewer arguments, is an index missing a platform nobody asked
          # about again until an operator pulls one.
          built=$(basename -a digests/* | sort | tr '\n' ' ')
          # One line, so no indentation of this file leaks into the
          # template's own output. Attestation manifests carry no real
          # architecture and are skipped rather than counted as a
          # platform nobody asked for.
          template='{{range .Manifest.Manifests}}{{if .Platform}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.Architecture}} {{end}}{{end}}{{end}}'
          published=$(scripts/ci/retry.sh docker buildx imagetools inspect "${NAME}@${digest}" --format "$template" \
            | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ')
          if [ "$built" != "$published" ]; then
            echo "the index serves [$published]; this run built [$built]"
            exit 1
          fi
          echo "reference=${NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Complete the standalone release artifacts
        # The completions are the same bytes on every platform, so they
        # are generated once here rather than per runner, and the
        # checksums each runner produced are joined into the one file the
        # publication verifies against.
        run: |
          go generate ./internal/command/...
          git diff --exit-code docs/reference/cli
          tar -C dist/completions -czf release-artifacts/runpool-completions.tar.gz .
          cd release-artifacts
          sha256sum runpool-completions.tar.gz > checksums.txt
          cat checksums-*.txt >> checksums.txt
          rm -f checksums-*.txt
          sha256sum -c checksums.txt

      - name: Keep the immutable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-candidate
          path: release-artifacts
          retention-days: 90
          if-no-files-found: error

  qualify:
    name: qualify the exact commit and candidates
    needs: candidate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/qualify-release.yml
    with:
      capsule_image: ${{ needs.candidate.outputs.capsule_image }}
      controller_image: ${{ needs.candidate.outputs.controller_image }}
    secrets: inherit

  publish:
    name: attest and publish qualified artifacts
    needs: [candidate, qualify, validate, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Download the release-qualification record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-qualification
          path: qualification

      - name: Download the standalone candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-candidate
          path: dist

      - name: Verify the release record and artifacts
        env:
          CAPSULE_IMAGE: ${{ needs.candidate.outputs.capsule_image }}
          COMMIT: ${{ github.sha }}
          CONTROLLER_IMAGE: ${{ needs.candidate.outputs.controller_image }}
        run: |
          go run ./internal/qualification/cmd/verify-record \
            -record qualification/release-qualification.json
          (cd dist && sha256sum -c checksums.txt)
          go run ./internal/qualification/cmd/verify-platform \
            -observed qualification/evidence/live/platform-facts.json

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote the qualified images
        id: promote
        env:
          CAPSULE_CANDIDATE: ${{ needs.candidate.outputs.capsule_image }}
          CAPSULE_NAME: ghcr.io/${{ github.repository }}/capsule
          CONTROLLER_CANDIDATE: ${{ needs.candidate.outputs.controller_image }}
          CONTROLLER_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A manifest copy inside the registry, not a pull and a retag:
          # pulling an index brings down the runner's own platform, and
          # pushing that back under the release tag would publish one
          # child of what was qualified. Copying the index preserves its
          # digest by construction, which is what the check below reads
          # back.
          promote() {
            candidate=$1
            name=$2
            digest=${candidate#*@}
            scripts/ci/retry.sh docker buildx imagetools create --tag "${name}:${VERSION}" "$candidate" >&2
            promoted=$(scripts/ci/retry.sh docker buildx imagetools inspect "${name}:${VERSION}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ "$promoted" != "$digest" ]; then
              echo "promoted digest differs from the qualified candidate"
              exit 1
            fi
            printf '%s' "${name}@${digest}"
          }
          controller_reference=$(promote "$CONTROLLER_CANDIDATE" "$CONTROLLER_NAME")
          capsule_reference=$(promote "$CAPSULE_CANDIDATE" "$CAPSULE_NAME")
          {
            echo "controller_name=$CONTROLLER_NAME"
            echo "controller_digest=${controller_reference#*@}"
            echo "controller_reference=$controller_reference"
            echo "capsule_name=$CAPSULE_NAME"
            echo "capsule_digest=${capsule_reference#*@}"
            echo "capsule_reference=$capsule_reference"
          } >> "$GITHUB_OUTPUT"

      - name: Generate the controller SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.promote.outputs.controller_reference }}
          format: spdx-json
          output-file: dist/controller.sbom.spdx.json
          upload-artifact: false

      - name: Generate the capsule SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.promote.outputs.capsule_reference }}
          format: spdx-json
          output-file: dist/capsule.sbom.spdx.json
          upload-artifact: false

      - name: Attest the standalone artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest the controller provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.controller_name }}
          subject-digest: ${{ steps.promote.outputs.controller_digest }}
          push-to-registry: true

      - name: Attest the controller SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.controller_name }}
          subject-digest: ${{ steps.promote.outputs.controller_digest }}
          sbom-path: dist/controller.sbom.spdx.json
          push-to-registry: true

      - name: Attest the capsule provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.capsule_name }}
          subject-digest: ${{ steps.promote.outputs.capsule_digest }}
          push-to-registry: true

      - name: Attest the capsule SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.capsule_name }}
          subject-digest: ${{ steps.promote.outputs.capsule_digest }}
          sbom-path: dist/capsule.sbom.spdx.json
          push-to-registry: true

      - name: Publish a draft GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/runpool-linux-amd64
            dist/runpool-linux-arm64
            dist/runpool-completions.tar.gz
            dist/checksums.txt
            dist/controller.sbom.spdx.json
            dist/capsule.sbom.spdx.json
            qualification/release-qualification.json
          body: |
            ${{ needs.validate.outputs.lead }}

            ## Deploy this release

            Point the Compose deployment at this controller digest and recreate
            the container:

            ```bash
            RUNPOOL_IMAGE=${{ steps.promote.outputs.controller_reference }}
            ```

            The controller carries the capsule digest below stamped into it and
            refuses any other, so there is one image to set. Read the
            [deployment guide](https://github.com/rhobuild/runpool/blob/${{ needs.version.outputs.version }}/docs/deployment.md)
            before a first installation, and
            [the runbook](https://github.com/rhobuild/runpool/blob/${{ needs.version.outputs.version }}/docs/runbook.md)
            before moving an existing one.

            ${{ needs.validate.outputs.detail }}

            ---

            ## Provenance

            | | |
            | --- | --- |
            | Release-qualified commit | `${{ github.sha }}` |
            | Controller | `${{ steps.promote.outputs.controller_reference }}` |
            | Capsule | `${{ steps.promote.outputs.capsule_reference }}` |

            Publication runs only after qualification passed against these exact
            digests, so an attestation signed here says more than that GitHub
            built it. Verify a digest before it reaches a deployment:

            ```bash
            gh attestation verify oci://${{ steps.promote.outputs.controller_reference }} \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml \
              --source-ref refs/tags/${{ needs.version.outputs.version }} \
              --deny-self-hosted-runners
            ```

            Attached: standalone `linux/amd64` and `linux/arm64` binaries with
            `checksums.txt`, an SBOM for each image, and the qualification
            record this release was authorized against.
          draft: true
          fail_on_unmatched_files: true
