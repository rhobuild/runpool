name: qualify-release

on:
  workflow_call:
    inputs:
      controller_image:
        description: Digest-qualified controller candidate
        required: true
        type: string
      capsule_image:
        description: Digest-qualified capsule candidate
        required: true
        type: string
    outputs:
      qualified_commit:
        description: Commit covered by the release-qualification record
        value: ${{ jobs.record.outputs.commit }}

defaults:
  run:
    # GitHub's default shell omits pipefail, so a step that pipes into tee
    # reports tee's exit status and a failing suite reads as a pass.
    shell: bash

permissions:
  contents: read
  packages: read

concurrency:
  group: qualify-release-${{ github.sha }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.7
  QUALIFICATION_COMMIT: ${{ github.sha }}
  QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  validate-ref:
    name: validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a protected release tag and immutable images
        env:
          CAPSULE_IMAGE: ${{ inputs.capsule_image }}
          CONTROLLER_IMAGE: ${{ inputs.controller_image }}
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "release qualification runs only from a protected SemVer tag"; exit 1 ;;
          esac
          for image in "$CONTROLLER_IMAGE" "$CAPSULE_IMAGE"; do
            case "$image" in
              *@sha256:*) ;;
              *) echo "release qualification requires digest-qualified image candidates"; exit 1 ;;
            esac
          done

      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Download the standalone candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-candidate
          path: release-artifacts

      - name: Verify the standalone candidate is the tag it claims
        env:
          CAPSULE_IMAGE: ${{ inputs.capsule_image }}
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-X main.version=${VERSION}" -o /tmp/runpool-version ./cmd/runpool
          /tmp/runpool-version version --check-release
          (cd release-artifacts && sha256sum -c checksums.txt)
          # Every binary in the bundle reports the version and the capsule
          # reference it was built with -- proven when it was built, on a
          # runner of its own architecture, which is the only place a
          # binary can be asked. What this adds is that the bundle
          # arriving here is the bundle that was built: the checksums
          # above cover the bytes, and this covers the one it can run.
          chmod +x release-artifacts/runpool-linux-amd64
          release-artifacts/runpool-linux-amd64 version --check-release
          facts=$(release-artifacts/runpool-linux-amd64 version --json)
          echo "$facts"
          for stamped in "$VERSION" "$CAPSULE_IMAGE"; do
            case "$facts" in
              *"$stamped"*) ;;
              *) echo "the standalone candidate does not report ${stamped}"; exit 1 ;;
            esac
          done

  hermetic:
    name: hermetic gate
    needs: validate-ref
    uses: ./.github/workflows/ci.yml

  live:
    name: live contracts on the reference host
    needs: validate-ref
    runs-on: [self-hosted, linux, x64, runpool-release-qualification]
    environment: release-qualification
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Verify the release-qualification reference
        run: |
          go run ./internal/qualification/cmd/platform-facts | tee platform-facts.json
          go run ./internal/qualification/cmd/verify-platform -observed platform-facts.json

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker_config="${RUNNER_TEMP}/runpool-qualification-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker --config "$docker_config" login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Pull the exact capsule candidate
        env:
          CAPSULE_IMAGE: ${{ inputs.capsule_image }}
        run: |
          scripts/ci/retry.sh docker pull "$CAPSULE_IMAGE"
          docker tag "$CAPSULE_IMAGE" runpool-capsule:dev

      - name: Run the Docker contracts
        env:
          RUNPOOL_CONTRACT_QUALIFY: "1"
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dir=$(mktemp -d)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$dir/docker-contract.test" ./test/contract/docker
          bash test/contract/docker/remote-harness.sh "$dir" 2>&1 | tee docker-contract.log
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go run ./internal/qualification/cmd/suite-evidence \
            -suite docker-contract -commit "$QUALIFICATION_COMMIT" -run "$QUALIFICATION_RUN_URL" \
            -started-at "$started" -completed-at "$completed" \
            -environment release-platform -runner self-hosted \
            -platform-facts platform-facts.json -log docker-contract.log \
            > docker-contract.json

      - name: Run the capsule, egress and budget contracts
        env:
          RUNPOOL_CONTRACT_QUALIFY: "1"
          CAPSULE_IMAGE: ${{ inputs.capsule_image }}
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dir=$(mktemp -d)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$dir/capsule-contract.test" ./test/contract/capsule
          bash test/contract/capsule/remote-harness.sh "$dir" 2>&1 | tee capsule-contract.log
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go run ./internal/qualification/cmd/suite-evidence \
            -suite capsule-contract -commit "$QUALIFICATION_COMMIT" -run "$QUALIFICATION_RUN_URL" \
            -started-at "$started" -completed-at "$completed" \
            -environment release-platform -runner self-hosted \
            -platform-facts platform-facts.json -capsule-image "$CAPSULE_IMAGE" \
            -log capsule-contract.log > capsule-contract.json

      - name: Run the durability suite on a named volume
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dir=$(mktemp -d)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$dir/sqlite-contract.test" ./test/contract/sqlite
          cp test/contract/sqlite/testdata/remote-harness.sh "$dir/"
          bash "$dir/remote-harness.sh" "$dir" 2>&1 | tee sqlite-contract.log
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go run ./internal/qualification/cmd/suite-evidence \
            -suite sqlite-durability -commit "$QUALIFICATION_COMMIT" -run "$QUALIFICATION_RUN_URL" \
            -started-at "$started" -completed-at "$completed" \
            -environment release-platform -runner self-hosted \
            -platform-facts platform-facts.json -log-format mixed \
            -log sqlite-contract.log > sqlite-durability.json

      - name: Run the lifecycle drills
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dir=$(mktemp -d)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$dir/drill-seed" ./test/drills/seed
          git ls-files -coz --exclude-standard | tar --no-xattrs -czf "$dir/src.tgz" --null -T -
          bash test/drills/remote-harness.sh "$dir" 2>&1 | tee lifecycle-drills.log
          completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go run ./internal/qualification/cmd/suite-evidence \
            -suite lifecycle-drills -commit "$QUALIFICATION_COMMIT" -run "$QUALIFICATION_RUN_URL" \
            -started-at "$started" -completed-at "$completed" \
            -environment release-platform -runner self-hosted \
            -platform-facts platform-facts.json -log-format drill \
            -log lifecycle-drills.log > lifecycle-drills.json

      - name: Verify no managed objects were left behind
        if: always()
        run: |
          status=0
          left=$(docker ps -aq --filter label=io.runpool.managed=true)
          if [ -n "$left" ]; then
            echo "containers left behind:"
            docker ps -a --filter label=io.runpool.managed=true
            status=1
          fi
          left=$(docker network ls -q --filter label=io.runpool.managed=true)
          if [ -n "$left" ]; then
            echo "networks left behind:"
            docker network ls --filter label=io.runpool.managed=true
            status=1
          fi
          left=$(docker volume ls -q --filter label=io.runpool.managed=true)
          if [ -n "$left" ]; then
            echo "volumes left behind:"
            docker volume ls --filter label=io.runpool.managed=true
            status=1
          fi
          exit "$status"

      # Its own step, and always: a leak this host reports must not also
      # decide whether its registry session is closed. The reference host
      # outlives the run.
      - name: Close the registry session
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            docker --config "$DOCKER_CONFIG" logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          fi

      - name: Keep the live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-evidence
          path: |
            platform-facts.json
            docker-contract.log
            docker-contract.json
            capsule-contract.log
            capsule-contract.json
            sqlite-contract.log
            sqlite-durability.json
            lifecycle-drills.log
            lifecycle-drills.json
          retention-days: 90
          if-no-files-found: error

  upstream:
    name: live upstream contracts
    needs: validate-ref
    uses: ./.github/workflows/contracts-github-actions.yml
    with:
      qualify: true
    secrets: inherit

  controller-e2e:
    name: controller end-to-end
    needs: live
    uses: ./.github/workflows/controller-e2e.yml
    with:
      controller_image: ${{ inputs.controller_image }}
      capsule_image: ${{ inputs.capsule_image }}
    secrets: inherit

  record:
    name: release-qualification record
    needs: [hermetic, live, upstream, controller-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ github.sha }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch modules
        run: scripts/ci/retry.sh go mod download

      - name: Download the live evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-evidence
          path: evidence/live

      - name: Download the hermetic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermetic-evidence
          path: evidence/hermetic

      - name: Download the upstream evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-evidence
          path: evidence/upstream

      - name: Download the controller end-to-end evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: controller-e2e-evidence-reference
          path: evidence/controller-e2e/reference

      - name: Download the portable controller evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: controller-e2e-evidence-portable
          path: evidence/controller-e2e/portable

      - name: Download the standalone candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-candidate
          path: evidence/release-artifacts

      - name: Assemble the release-qualification record
        env:
          CAPSULE_IMAGE: ${{ inputs.capsule_image }}
          COMMIT: ${{ github.sha }}
          CONTROLLER_IMAGE: ${{ inputs.controller_image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          go run ./internal/qualification/cmd/record -evidence evidence \
            > release-qualification.json
          cat release-qualification.json

      - name: Keep the release-qualification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification
          path: |
            release-qualification.json
            evidence
          retention-days: 90
          if-no-files-found: error
