# The gate every change passes. It runs on GitHub-hosted runners on
# purpose: Runpool's own CI must not depend on Runpool, so a bug here
# cannot hide behind the thing it is testing.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Release qualification runs this same gate rather than a copy of it: two
  # definitions of "the hermetic gate" would drift, and the one that
  # decides a release must be the one every change already passed.
  workflow_call:

defaults:
  run:
    # GitHub's default shell omits pipefail, so a step that pipes into tee
    # reports tee's exit status and a failing suite reads as a pass.
    shell: bash

# Read-only by default; no job in this workflow needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The exact toolchain, so no step silently switches compilers: go.mod
  # names the version and this refuses any automatic substitution. A
  # reproducible build pins the compiler, not just the dependencies.
  GOTOOLCHAIN: go1.26.6

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact toolchain from go.mod's toolchain directive, not
          # the latest patch: a reproducible build pins the compiler.
          go-version-file: go.mod
      - name: Verify formatting
        # gofmt -l prints offenders and exits zero, so the check has to
        # look at the output rather than the status.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        # The check set lives in staticcheck.conf (all checks, with the
        # generated persistence directory subtracting the package-comment
        # rule); a -checks flag here would override those files.
        #
        # Staticcheck exits zero both when clean and when it matched no
        # packages, so an older release paired with a newer Go once
        # printed "matched no packages" and passed — a gate that analyzed
        # nothing. Capture stderr and fail on that warning, and require a
        # non-empty package set, so the gate cannot pass by analyzing
        # zero packages.
        run: |
          test "$(go list ./... | wc -l)" -gt 0 || { echo "no packages to analyze"; exit 1; }
          err=$(go tool staticcheck ./... 2>&1 1>/dev/null) || { echo "$err"; exit 1; }
          if printf '%s' "$err" | grep -q 'matched no packages'; then
            echo "staticcheck analyzed no packages:"; echo "$err"; exit 1
          fi
          go tool staticcheck ./...
      - name: Test with the race detector and measure coverage
        # One run, carrying every property both steps had. Shuffled, so a
        # test that depends on another's leftovers fails here rather than
        # on the day the order happens to change; raced, so a data race
        # is a failure rather than a flake; and profiled, because running
        # the whole suite twice to learn the same thing costs the slowest
        # job in this workflow twice over.
        #
        # The global floor protects the hermetic surface from regression;
        # live contracts cover the Docker and provider adapters
        # separately. The contract suites are gated by environment and
        # skip here: they need a Docker host and real targets, and
        # release qualification runs them without skips before any
        # release. Requiring covdata also rejects an incomplete Go
        # distribution.
        run: |
          go tool -n covdata >/dev/null 2>&1 || { echo "toolchain has no covdata; it is not a complete distribution"; exit 1; }
          go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -count=1 ./...
          scripts/verify/coverage.sh coverage.out
      - name: Keep the coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error
      - name: Verify the generated persistence layer is current
        # sqlc diff regenerates and compares against the committed code;
        # the schema parity test in internal/store does the same for the
        # snapshot the generation reads. Together they leave no second
        # source of truth: migrations produce the snapshot, the snapshot
        # produces the code, and drift anywhere fails here.
        run: |
          go tool sqlc diff
          go tool sqlc vet
      - name: Verify generated CLI documentation is current
        run: |
          go generate ./internal/command/...
          git diff --exit-code docs/reference/cli
      - name: Verify the module is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build the release binaries
        # Static and cross-built for the platforms a release ships, so a
        # build tag or a cgo dependency that only breaks elsewhere
        # breaks here instead.
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/runpool ./cmd/runpool
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/runpool ./cmd/capsule-supervisor
          done
      - name: Verify the configuration examples still validate
        run: |
          /tmp/runpool config validate --file internal/config/testdata/example.yaml
          /tmp/runpool config validate --file deploy/compose/config.example.yaml
      - name: Verify the locked image digests have not drifted
        # Only the registry half: that each locked tag still resolves to the
        # digest recorded beside it. That the Dockerfiles build from those
        # digests is hermetic, so internal/app carries it as a test.
        run: scripts/verify/image-lock.sh

  lint:
    name: workflows, scripts and containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint the workflows
        # Pinned in go.mod like every other gate: a linter resolved at
        # run time changes what passes without anyone deciding to.
        #
        # The example under deploy/ is named explicitly: actionlint scans
        # .github/workflows by itself, and an example workflow nobody
        # checks is worse than none — a reader copies it.
        run: go tool actionlint && go tool actionlint deploy/workflows/*.yml
      - name: Lint the shell scripts
        # shellcheck ships with the runner image; the harness scripts
        # run against real hosts, where a quoting bug deletes the wrong
        # thing.
        #
        # Every script git knows about, rather than a glob. The globs
        # this replaces were one directory deep and missed
        # test/drills/remote-drills.sh, which two workflows execute — a
        # script CI runs and does not lint is the one place a quoting bug
        # reaches a real host unread. Untracked but unignored files
        # count: a script is worth linting from the moment it exists, not
        # from the moment it is added.
        run: git ls-files -coz --exclude-standard -- "*.sh" | xargs -0 shellcheck
      - name: Lint the Dockerfiles
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          recursive: true
          dockerfile: build/*/Dockerfile
          # DL3008 (pin apt versions) is answered by the digest-pinned
          # base image plus the image lock; pinning apt versions on top
          # of that pins us to a distribution's mirror lifetime.
          ignore: DL3008
      - name: Validate the reference deployment
        run: |
          mkdir -p /tmp/runpool-ci-credentials
          RUNPOOL_IMAGE=ghcr.io/rhobuild/runpool@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            RUNPOOL_CONFIG_PATH="$GITHUB_WORKSPACE/deploy/compose/config.example.yaml" \
            RUNPOOL_CREDENTIALS_PATH=/tmp/runpool-ci-credentials \
            docker compose -f deploy/compose/compose.yaml config --quiet

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for known vulnerabilities
        # The scanner is pinned in go.mod and run with `go tool`: a gate
        # that resolves @latest at run time cannot be reproduced, and a
        # security gate that changes under you is not a gate.
        run: go tool govulncheck ./...

  image:
    name: controller image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the controller image
        # Built but not pushed: publishing is a release decision, and a
        # pull request must never be able to publish.
        run: docker build -f build/controller/Dockerfile -t runpool:ci .
      - name: The runtime layer must carry no shell
        run: |
          if docker run --rm --entrypoint sh runpool:ci -c true 2>/dev/null; then
            echo "a shell is reachable in the runtime layer"; exit 1
          fi
      - name: The image must run
        run: docker run --rm runpool:ci version
